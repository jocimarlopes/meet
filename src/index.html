<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Jolo Meet</title>

  <base href="/" />

  <meta name="description" content="Chamada de vídeo e chat direto entre navegadores, cifrado ponta a ponta com PGP." />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- SVG primeiro: nítido em qualquer tamanho. O PNG cobre quem não o aceita. -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!--
    Google tag (gtag.js), só no site.

    Dentro do aplicativo a origem é `https://localhost`, e ali o analytics não
    entra: um app que promete que nada sai dele não pode abrir conexão com três
    hosts do Google a cada abertura. De quebra, também não polui o
    desenvolvimento local nem os testes.
  -->
  <script>
    (function () {
      var host = location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') return;

      var tag = document.createElement('script');
      tag.async = true;
      tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-H200ZMPYB4';
      document.head.appendChild(tag);

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-H200ZMPYB4');
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
