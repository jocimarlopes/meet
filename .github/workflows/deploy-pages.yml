name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; deixa a fila terminar em vez de cancelar no meio.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Publicado em jocimarlopes.github.io/meet/, então os assets precisam ser
  # buscados nesse prefixo — com '/' a página abre em branco. Precisa bater
  # com o nome do repositório. Migrando para domínio próprio, volte para '/'.
  BASE_HREF: /meet/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx ng build --configuration production --base-href "$BASE_HREF"

      # As rotas são por caminho, sem '#'. O Pages não tem fallback de rota, e
      # abrir um link de convite direto cairia em 404. Servindo o mesmo HTML
      # como 404.html, o app inicia e a rota resolve no cliente.
      - run: cp www/index.html www/404.html

      # Deep links: o iOS e o Android verificam estes arquivos no domínio para
      # abrir o app nativo em vez do navegador. Precisam estar em /.well-known/
      # na raiz do domínio — no Pages de projeto ficam em /meet/.well-known/,
      # então é necessário publicar também no repositório do user site
      # (jocimarlopes.github.io) se quiser que funcionem sem domínio próprio.
      - run: cp -r .well-known www/.well-known

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
