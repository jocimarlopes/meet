<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <!-- Gráfico de destaque da Play (1024x500). A loja recorta as bordas em
       alguns lugares, então nada essencial encosta nelas. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fdd" />
      <stop offset="1" stop-color="#3880ff" />
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#fundo)" />

  <g transform="translate(190 250) scale(3.4) translate(-34.5 -28.5)">
    <path d="M20 22v-3a8 8 0 0 1 16 0v3" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
    <rect x="11" y="22" width="34" height="24" rx="6" fill="#fff" />
    <path d="M49 28.5 58 24v16l-9-4.5z" fill="#fff" />
  </g>

  <text x="330" y="228" fill="#ffffff"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="700" letter-spacing="-2">Jolo Meet</text>
  <text x="332" y="292" fill="rgba(255,255,255,.92)"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="500">Conversa direta, cifrada ponta a ponta</text>
  <text x="332" y="344" fill="rgba(255,255,255,.72)"
        font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="400">Sem servidor no meio · Nada guardado</text>
</svg>
